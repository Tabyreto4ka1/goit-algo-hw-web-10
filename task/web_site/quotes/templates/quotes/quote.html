 {% extends "quotes/base.html" %}

{% block content %}

<form method="POST" action="{% url 'quotes:quote' %}">
    {% csrf_token %}

    <div style="padding: 10px">
        <label for="{{ form.tags.id_for_label }}">Enter the tags(tag1,tag2):</label>
        {{ form.tags }}
        {{ form.tags.errors }}

        <label for="{{ form.quote.id_for_label }}">Enter the quote:</label>
        {{ form.quote }}
        {{ form.quote.errors }}

        <label for="{{ form.author.id_for_label }}">Enter the author:</label>
        {{ form.author }}
        {{ form.author.errors }}
    </div>

    <div class="grid">
        <button type="submit">Submit</button>
        <button type="reset" class="secondary">Reset</button>
    </div>
</form>

{% endblock %}
