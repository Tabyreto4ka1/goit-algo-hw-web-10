{% extends "quotes/base.html" %}
{% block content %}

<div>
<h3>Top 10 tags</h3>
{% for tag in ten_tags %} 
<ul>
    <li>{{tag}}</li>
</ul>
</div>
  {% endfor %}

{% for quote in quotes%}

<ul>
    <li>
        <b>Quote:</b><br>
        {{quote.quote}}<br>
        <b>Tags:</b>
        {% for tag in quote.tags %}
        <a href="{% url 'quotes:tag' tag %}">{{tag}}</a><br>
        {% endfor %}
        <b>Author:</b>  <a href="{% url 'quotes:author_detail' quote.author %}" role="button" class="outline">{{quote.author}}</a>
    </li>
</ul>

{% endfor %}

{% endblock %}
